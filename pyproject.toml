[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "polymarket-sentinel"
version = "1.0.0"
description = "AI-powered Polymarket betting bot with sentiment analysis and whale tracking"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [
    {name = "Polymarket Sentinel"}
]
dependencies = [
    "httpx>=0.25.0",
    "aiohttp>=3.9.0",
    "web3>=6.11.0",
    "tweepy>=4.14.0",
    "textblob>=0.17.1",
    "vaderSentiment>=3.3.2",
    "numpy>=1.24.0",
    "pandas>=2.0.0",
    "scipy>=1.11.0",
    "python-dotenv>=1.0.0",
    "rich>=13.5.0",
    "typer>=0.9.0",
    "asyncio>=3.4.3",
    "pydantic>=2.5.0",
    "pydantic-settings>=2.1.0",
    "APScheduler>=3.10.0",
    "cachetools>=5.3.0",
    "tenacity>=8.2.0",
    "structlog>=23.2.0",
    "py-clob-client>=0.17.0",
    "websockets>=12.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4.0",
    "pytest-asyncio>=0.21.0",
    "pytest-cov>=4.1.0",
    "black>=23.9.0",
    "ruff>=0.0.290",
    "mypy>=1.5.0",
]

[project.scripts]
polysentinel = "src.cli:app"

[tool.setuptools.packages.find]
where = ["."]

[tool.black]
line-length = 100
target-version = ["py310"]

[tool.ruff]
line-length = 100
select = ["E", "F", "I", "N", "W"]

[tool.mypy]
python_version = "3.10"
warn_return_any = true
warn_unused_configs = true
