[project]
name = "corrugated-calc"
version = "0.2.0"
description = "Калкулатор и офериране на изделия от велпапе — детерминиран engine и API"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.110", "pydantic>=2.6", "uvicorn>=0.29", "python-multipart>=0.0.9",
    "sqlalchemy>=2.0", "alembic>=1.13", "psycopg[binary]>=3.1",
    "openpyxl>=3.1", "xlrd>=2.0", "pdfplumber>=0.11", "pypdfium2>=4", "pillow>=10", "pillow-heif>=0.16",
    "pytesseract>=0.3.10",
]

[project.optional-dependencies]
dev = ["pytest>=8", "httpx>=0.27", "xlwt>=1.3", "reportlab>=4"]

[tool.setuptools.packages.find]
include = ["calc*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
