[project]
name = "corrugated-calc"
version = "0.1.0"
description = "Калкулатор и офериране на изделия от велпапе — детерминиран engine и API"
requires-python = ">=3.11"
dependencies = ["fastapi>=0.110", "pydantic>=2.6", "uvicorn>=0.29"]

[project.optional-dependencies]
dev = ["pytest>=8", "httpx>=0.27"]

[tool.setuptools.packages.find]
include = ["calc*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
